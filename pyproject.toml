[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dbscope"
version = "0.1.0"
description = "MCP server for read-only SQL access to dev, qa and prod databases without exposing credentials to the LLM."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "dbscope contributors" }]
keywords = ["mcp", "mysql", "mariadb", "read-only", "opencode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Security",
]
dependencies = [
  "mcp>=1.9,<2",
  "pymysql>=1.1,<2",
  "pydantic>=2.8,<3",
  "sqlglot>=25,<28",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
dbscope = "dbscope.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dbscope"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "keyring",
  "keyring.*",
  "mcp",
  "mcp.*",
  "pymysql",
  "pymysql.*",
  "sqlglot",
  "sqlglot.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires a real database and is skipped by default",
]

[tool.coverage.run]
source = ["src/dbscope"]
branch = true
